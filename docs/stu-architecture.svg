<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Stu system architecture</title>
  <desc id="desc">Academic data flows through a versioned ingestion contract into SQLite, then into planning, recommendations, and a degree-scale visualization in development. Study feedback returns to the planning engine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182e"/>
      <stop offset="1" stop-color="#112d4f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#69d2e7"/>
    </marker>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="95" r="120" fill="#3c74a8" opacity=".12"/>
  <circle cx="100" cy="625" r="165" fill="#59c3c3" opacity=".08"/>
  <text x="70" y="78" fill="#ffffff" font-family="Arial, sans-serif" font-size="35" font-weight="700">Stu Architecture</text>
  <text x="70" y="113" fill="#a8c5dc" font-family="Arial, sans-serif" font-size="19">Local-first academic planning with an explainable path from evidence to action</text>
  <g fill="none" stroke="#69d2e7" stroke-width="4" marker-end="url(#arrow)">
    <path d="M300 235 H420"/>
    <path d="M700 235 H820"/>
    <path d="M970 315 V400"/>
    <path d="M820 490 H700"/>
    <path d="M555 315 V400"/>
    <path d="M420 490 H300"/>
  </g>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g>
      <rect x="70" y="165" width="230" height="140" rx="18" fill="#173b60" stroke="#4c86b8" stroke-width="2"/>
      <text x="185" y="217" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">Academic input</text>
      <text x="185" y="252" fill="#c7deee" font-size="17" text-anchor="middle">LMS export</text>
      <text x="185" y="278" fill="#c7deee" font-size="17" text-anchor="middle">Structured records</text>
    </g>
    <g>
      <rect x="420" y="165" width="280" height="140" rx="18" fill="#173b60" stroke="#4c86b8" stroke-width="2"/>
      <text x="560" y="217" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">Versioned ingestion</text>
      <text x="560" y="254" fill="#c7deee" font-size="17" text-anchor="middle">stu-lms-v1 contract</text>
      <text x="560" y="280" fill="#c7deee" font-size="17" text-anchor="middle">Validation and normalization</text>
    </g>
    <g>
      <rect x="820" y="165" width="300" height="150" rx="18" fill="#214d70" stroke="#69d2e7" stroke-width="3"/>
      <text x="970" y="219" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle">SQLite academic record</text>
      <text x="970" y="256" fill="#d7edf5" font-size="17" text-anchor="middle">Authoritative local state</text>
      <text x="970" y="282" fill="#d7edf5" font-size="17" text-anchor="middle">Courses, work and progress</text>
    </g>
    <g>
      <rect x="820" y="400" width="300" height="180" rx="18" fill="#173b60" stroke="#4c86b8" stroke-width="2"/>
      <text x="970" y="452" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">Degree visualization</text>
      <text x="970" y="490" fill="#c7deee" font-size="17" text-anchor="middle">Interaction model in development</text>
      <text x="970" y="517" fill="#c7deee" font-size="17" text-anchor="middle">Degree-wide context</text>
      <text x="970" y="544" fill="#c7deee" font-size="17" text-anchor="middle">Never a second record system</text>
    </g>
    <g>
      <rect x="420" y="400" width="280" height="180" rx="18" fill="#214d70" stroke="#69d2e7" stroke-width="3"/>
      <text x="560" y="451" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">Planning engine</text>
      <text x="560" y="489" fill="#d7edf5" font-size="17" text-anchor="middle">Deterministic priority</text>
      <text x="560" y="516" fill="#d7edf5" font-size="17" text-anchor="middle">Capacity-aware scheduling</text>
      <text x="a" y="b" fill="none"/>
      <text x="560" y="543" fill="#d7edf5" font-size="17" text-anchor="middle">Evidence-qualified advice</text>
    </g>
    <g>
      <rect x="70" y="400" width="230" height="180" rx="18" fill="#173b60" stroke="#4c86b8" stroke-width="2"/>
      <text x="185" y="451" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">Student action</text>
      <text x="185" y="489" fill="#c7deee" font-size="17" text-anchor="middle">Today plan</text>
      <text x="185" y="516" fill="#c7deee" font-size="17" text-anchor="middle">Recommendations</text>
      <text x="185" y="543" fill="#c7deee" font-size="17" text-anchor="middle">Study feedback</text>
    </g>
  </g>
  <text x="600" y="652" fill="#8fb2ca" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Academic evidence remains authoritative, local, portable and explainable.</text>
</svg>